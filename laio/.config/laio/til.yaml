name: til
# https://laio.sh/docs/workflow/session-export/
startup:
  - command: echo
    args:
      - starting til session # add commands here to run on session startup

shutdown:
  - command: echo
    args:
      - stopping til session # add commands here to run on session shutdown

path: /home/lacon/projects/til

windows:
  - name: home
    flex_direction: column # panes are above one another, if ommited defaults to row where panes are side by side
    panes:
      - name: services
        commands:
          - command: lazydocker

  - name: http-crud
    flex_direction: row
    panes:
      - flex: 1
      - flex: 1
        path: . # optional relative or absolute path
        flex_direction: column
        panes:
          - flex: 1
          - flex: 5
