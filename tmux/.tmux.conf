##display-popup 
bind 'y' display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"

bind 'j' display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
# bind 'c' display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'

set-option -g status-position top


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'laktak/extrakto'
# set -g @plugin 'fcsonline/tmux-thumbs'

# Panes Style
set -g pane-border-lines simple
set-option -g pane-border-indicators arrows

# # Status style.
set -g status-style "fg=#BBC3D4,bg=#1e1e1e"
set -g status-right "#[fg=#BBC3D4,bg=#1e1e1e] #[fg=##d1d1a1,bg=#1e1e1e]"
set -g status-left  ""
# set -g status-left "#S#[fg=#A04747,bg=#1e1e1e]#[fg=#1e1e1e,bg=#A04747,bold] яичко#[fg=#A04747,bg=#1e1e1e] #[fg=#3B4252,bg=#1e1e1e]#S"

# set -g status-left-length 500
set -g status-position top
set -g status-justify centre

# # Window style.
# set -g window-status-style "fg=#434C5E,bg=#1e1e1e"
# set -g window-status-current-format "#[fg=##d1d1a1,bg=#1e1e1e]#[fg=#1e1e1e,bg=##d1d1a1,bold]#I:#W#[fg=##d1d1a1,bg=#1e1e1e]"

# set -g window-status-current-format "#[fg=##5d4175,bg=#1e1e1e]#[fg=##ffffff,bg=##5d4175,bold]#I:#W#[fg=##5d4175,bg=#1e1e1e]"
set -g window-status-format " #I:#W "
set -g window-status-separator " "


